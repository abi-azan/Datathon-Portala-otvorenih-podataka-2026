<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Izvori podataka Fiskalne karte</title>
  <desc id="d">Sedam tijela javnog sektora. Preko API-ja: Portal otvorenih podataka (CKAN), Državni zavod za statistiku (PxWeb) i Državni zavod za statistiku (INSPIRE WFS). Kao datoteke, jer API ne postoji: Ministarstvo financija, Porezna uprava, Državni ured za reviziju, Državna geodetska uprava i Ministarstvo regionalnoga razvoja i fondova EU.</desc>
  <defs>
    <style>
      .bg { fill: #faf9f6 }
      .card { fill: #ffffff; stroke: #dedcd5; stroke-width: 2 }
      .h { font: 600 76px 'Source Serif 4', Georgia, 'Times New Roman', serif; fill: #0b0b0b }
      .sub { font: 400 34px 'Public Sans', 'Segoe UI', Arial, sans-serif; fill: #55544f }
      .eyebrow { font: 600 24px 'Public Sans', 'Segoe UI', Arial, sans-serif; fill: #6b6a66; letter-spacing: 2.8px }
      .eyebrow.g { fill: #087664 }
      .name { font: 600 34px 'Public Sans', 'Segoe UI', Arial, sans-serif; fill: #0b0b0b }
      .txt { font: 400 27px 'Public Sans', 'Segoe UI', Arial, sans-serif; fill: #3a3936 }
      .api { fill: #e1f0ea }
      .apit { font: 600 23px 'Public Sans', 'Segoe UI', Arial, sans-serif; fill: #087664; letter-spacing: 0.6px }
      .file { fill: #efede7 }
      .filet { font: 600 23px 'Public Sans', 'Segoe UI', Arial, sans-serif; fill: #55544f; letter-spacing: 0.6px }
      .foot { font: 400 30px 'Public Sans', 'Segoe UI', Arial, sans-serif; fill: #1d1c1a }
      .footb { font-weight: 600 }
    </style>
  </defs>
  <rect class="bg" width="1920" height="1080"/>

  <text class="h" x="96" y="138">Izvori podataka</text>
  <text class="sub" x="96" y="196">Sedam tijela javnog sektora, spojeno po OIB-u, RKP-u i službenoj šifri jedinice.</text>

  <!-- left: read through an API -->
  <text class="eyebrow g" x="96" y="276">PREKO API-JA · U OBRADI I UŽIVO IZ PREGLEDNIKA</text>

  <rect class="card" x="96" y="300" width="840" height="170" rx="18"/>
  <text class="name" x="128" y="356">Portal otvorenih podataka</text>
  <rect class="api" x="716" y="324" width="188" height="44" rx="22"/>
  <text class="apit" x="810" y="354" text-anchor="middle">API · CKAN</text>
  <text class="txt" x="128" y="402">katalog svih skupova; koje jedinice objavljuju</text>
  <text class="txt" x="128" y="438">podatke i kada; datoteke Porezne uprave</text>

  <rect class="card" x="96" y="494" width="840" height="170" rx="18"/>
  <text class="name" x="128" y="550">Državni zavod za statistiku</text>
  <rect class="api" x="704" y="518" width="200" height="44" rx="22"/>
  <text class="apit" x="804" y="548" text-anchor="middle">API · PxWeb</text>
  <text class="txt" x="128" y="596">procjena stanovništva, migracije, rođeni i umrli,</text>
  <text class="txt" x="128" y="632">turizam, građevinske dozvole</text>

  <rect class="card" x="96" y="688" width="840" height="170" rx="18"/>
  <text class="name" x="128" y="744">Državni zavod za statistiku</text>
  <rect class="api" x="640" y="712" width="264" height="44" rx="22"/>
  <text class="apit" x="772" y="742" text-anchor="middle">API · INSPIRE WFS</text>
  <text class="txt" x="128" y="790">granice 556 općina i gradova, Popis 2021.</text>
  <text class="txt" x="128" y="826">(servis Nacionalne infrastrukture prostornih podataka)</text>

  <!-- right: files, where no API exists -->
  <text class="eyebrow" x="984" y="276">DATOTEKE · SAMO GDJE API NE POSTOJI</text>

  <rect class="card" x="984" y="300" width="840" height="170" rx="18"/>
  <text class="name" x="1016" y="356">Ministarstvo financija</text>
  <rect class="file" x="1648" y="324" width="144" height="44" rx="22"/>
  <text class="filet" x="1720" y="354" text-anchor="middle">EXCEL</text>
  <text class="txt" x="1016" y="402">financijski izvještaji 576 jedinica, 2019.–2025.;</text>
  <text class="txt" x="1016" y="438">fiskalno izravnanje</text>

  <rect class="card" x="984" y="494" width="840" height="122" rx="18"/>
  <text class="name" x="1016" y="548">Porezna uprava</text>
  <rect class="file" x="1648" y="516" width="144" height="44" rx="22"/>
  <text class="filet" x="1720" y="546" text-anchor="middle">EXCEL</text>
  <text class="txt" x="1016" y="590">neto dohodak stanovništva, porezne stope jedinica</text>

  <rect class="card" x="984" y="640" width="840" height="122" rx="18"/>
  <text class="name" x="1016" y="694">Državni ured za reviziju</text>
  <rect class="file" x="1680" y="662" width="112" height="44" rx="22"/>
  <text class="filet" x="1736" y="692" text-anchor="middle">PDF</text>
  <text class="txt" x="1016" y="736">mišljenja financijskih revizija za 331 jedinicu</text>

  <rect class="card" x="984" y="786" width="840" height="122" rx="18"/>
  <text class="name" x="1016" y="840">Državna geodetska uprava · MRRFEU</text>
  <text class="txt" x="1016" y="882">šifrarnik jedinica; indeks razvijenosti</text>

  <text class="foot" x="96" y="990"><tspan class="footb">9 skupova preko API-ja.</tspan> Svaku datoteku obrada preuzima sama i bilježi adresu, vrijeme i otisak (sha256).</text>
</svg>
